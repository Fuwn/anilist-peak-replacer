name: Check

on:
  push:
  pull_request:

jobs:
  check:
    name: Type-Check, Test, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Type-Check and Test
        run: bun run check

      - name: Build
        run: bun run build
